<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitMatch</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text: #e6edf3;
      --muted: #8b949e;
      --tag-bg: #21262d;
      --error: #f85149;
      --warn: #d29922;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header h1 span { color: var(--accent-hover); }
    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95rem;
      max-width: 480px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 40px;
    }
    .search-box input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: #58a6ff; }
    .search-box input::placeholder { color: var(--muted); }
    .search-box button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 20px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .search-box button:hover { background: var(--accent-hover); }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
      min-height: 20px;
    }
    #status.error { color: var(--error); }

    #results { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 24px; }

    .repo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .repo-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .repo-header-left { flex: 1; min-width: 0; }
    .repo-name {
      font-size: 1rem;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
      word-break: break-word;
    }
    .repo-name:hover { text-decoration: underline; }
    .repo-explanation {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
      line-height: 1.4;
    }
    .feedback-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .feedback-btns button {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 5px 9px;
      transition: background 0.1s, color 0.1s;
    }
    .feedback-btns button:hover { background: var(--border); color: var(--text); }
    .feedback-btns button.active-up { background: #1a3826; color: #3fb950; border-color: #3fb950; }
    .feedback-btns button.active-down { background: #3d1a1a; color: var(--error); border-color: var(--error); }

    .issues-list { padding: 0 20px 16px; }
    .issues-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 0 8px;
    }
    .no-issues { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }

    .issue-row {
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
    }
    .issue-left { flex: 1; min-width: 0; }
    .issue-title {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      line-height: 1.4;
    }
    .issue-title:hover { color: #58a6ff; }
    .issue-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.7rem;
      padding: 1px 8px;
    }
    .score-bar {
      align-items: center;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      gap: 3px;
    }
    .score-num { color: var(--muted); font-size: 0.7rem; }
    .score-fill {
      background: var(--accent);
      border-radius: 2px;
      height: 36px;
      opacity: 0.7;
      width: 4px;
    }

    .spinner {
      border: 3px solid var(--border);
      border-top-color: #58a6ff;
      border-radius: 50%;
      height: 28px;
      width: 28px;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .metrics-section {
      width: 100%;
      max-width: 760px;
      margin-top: 56px;
      border-top: 1px solid var(--border);
      padding-top: 32px;
    }
    .metrics-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .metrics-section p {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 16px;
    }
    .metrics-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .metrics-table th, .metrics-table td {
      border: 1px solid var(--border);
      padding: 7px 12px;
      text-align: center;
    }
    .metrics-table th { background: var(--tag-bg); color: var(--muted); font-weight: 600; }
    .metrics-table td:first-child { text-align: left; font-weight: 500; }
    .metrics-table tr.nn-row td { color: #3fb950; }
    .metrics-note { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Git<span>Match</span></h1>
    <p>Enter a GitHub username to get personalised repository and issue recommendations.</p>
  </header>

  <form class="search-box" id="searchForm">
    <input id="usernameInput" type="text" placeholder="GitHub username" autocomplete="off" spellcheck="false" />
    <button type="submit" id="searchBtn">Find matches</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>
  <div class="metrics-section" id="metricsSection" style="display:none"></div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('usernameInput');
    const btn = document.getElementById('searchBtn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = input.value.trim();
      if (!username) return;
      await search(username);
    });

    async function search(username) {
      btn.disabled = true;
      statusEl.className = '';
      statusEl.innerHTML = '<div class="spinner"></div>';
      resultsEl.innerHTML = '';

      try {
        const res = await fetch('/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, top_k_repos: 5, top_k_issues: 8 }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || res.statusText);
        }

        const data = await res.json();
        statusEl.textContent = `${data.length} repositories matched for @${username}`;
        renderResults(data);
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderResults(repos) {
      resultsEl.innerHTML = '';
      repos.forEach((repo, ri) => {
        const card = document.createElement('div');
        card.className = 'repo-card';

        const ghUrl = `https://github.com/${repo.repo}`;
        const issuesHtml = repo.issues.length
          ? repo.issues.map(issue => {
              const tagsHtml = issue.labels.map(l => `<span class="tag">${escHtml(l)}</span>`).join('');
              const fillH = Math.round(issue.relevance_score * 36);
              return `
                <div class="issue-row">
                  <div class="issue-left">
                    <a class="issue-title" href="${escHtml(issue.url)}" target="_blank" rel="noopener">
                      #${issue.number} ${escHtml(issue.title)}
                    </a>
                    ${tagsHtml ? `<div class="issue-tags">${tagsHtml}</div>` : ''}
                  </div>
                  <div class="score-bar">
                    <div class="score-fill" style="height:${fillH}px"></div>
                    <span class="score-num">${(issue.relevance_score * 100).toFixed(0)}%</span>
                  </div>
                </div>`;
            }).join('')
          : '<p class="no-issues">No open issues found.</p>';

        card.innerHTML = `
          <div class="repo-header">
            <div class="repo-header-left">
              <a class="repo-name" href="${ghUrl}" target="_blank" rel="noopener">${escHtml(repo.repo)}</a>
              <p class="repo-explanation">${escHtml(repo.explanation)}</p>
            </div>
            <div class="feedback-btns">
              <button class="thumb-up" title="Good recommendation" data-ri="${ri}">👍</button>
              <button class="thumb-down" title="Bad recommendation" data-ri="${ri}">👎</button>
            </div>
          </div>
          <div class="issues-list">
            <div class="issues-label">Open issues</div>
            ${issuesHtml}
          </div>`;

        card.querySelectorAll('.thumb-up, .thumb-down').forEach(btn => {
          btn.addEventListener('click', () => {
            const isUp = btn.classList.contains('thumb-up');
            const parent = btn.closest('.feedback-btns');
            parent.querySelectorAll('button').forEach(b => b.classList.remove('active-up', 'active-down'));
            btn.classList.add(isUp ? 'active-up' : 'active-down');
          });
        });

        resultsEl.appendChild(card);
      });
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Load and render evaluation metrics table
    async function loadMetrics() {
      try {
        const res = await fetch('/metrics');
        if (!res.ok) return;
        const data = await res.json();
        const models = Object.keys(data);
        if (!models.length) return;
        const ks = [5, 10, 20];
        const rows = models.map(model => {
          const isNN = model.toLowerCase().includes('tower') || model.toLowerCase().includes('nn');
          const cells = ks.flatMap(k => {
            const m = data[model];
            const pk = m[`P@${k}`] ?? '—';
            const rk = m[`R@${k}`] ?? '—';
            const nk = m[`NDCG@${k}`] ?? '—';
            return [pk, rk, nk].map(v => `<td>${typeof v === 'number' ? v.toFixed(4) : v}</td>`);
          });
          return `<tr class="${isNN ? 'nn-row' : ''}"><td>${escHtml(model)}</td>${cells.join('')}</tr>`;
        });
        const headers = ks.flatMap(k => [`P@${k}`, `R@${k}`, `NDCG@${k}`]).map(h => `<th>${h}</th>`).join('');
        const section = document.getElementById('metricsSection');
        section.innerHTML = `
          <h2>Offline Evaluation</h2>
          <p>Precision@K, Recall@K and NDCG@K on a held-out 15% test split (Two-Tower NN highlighted in green).</p>
          <table class="metrics-table">
            <thead><tr><th>Model</th>${headers}</tr></thead>
            <tbody>${rows.join('')}</tbody>
          </table>
          <p class="metrics-note">Test set: ~1,300 held-out interactions across 744 users. Higher is better.</p>`;
        section.style.display = 'block';
      } catch (_) {}
    }
    loadMetrics();
  </script>
</body>
</html>
